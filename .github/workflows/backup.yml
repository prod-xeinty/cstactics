# Ежедневный зашифрованный бэкап боевой D1 → артефакт GitHub Actions (хранится 30 дней).
# Перед шифрованием выгрузка восстанавливается в чистую базу и проверяется.
# Нужны: секреты окружения «backup» CF_BACKUP_TOKEN (только право D1) и CLOUDFLARE_ACCOUNT_ID, публичный ключ в
# security/backup-recipients.txt. Окружение «backup» — только для ветки main: токен с правом записи в D1
# не должен доставаться workflow из других веток.
# Пока чего-то нет — прогон зелёный с пометкой «не настроено». Порядок восстановления — docs/ops/backup-restore.md.
name: Бэкап D1

on:
  schedule:
    - cron: "41 0 * * *" # 03:41 МСК, ночью нагрузка минимальная (выгрузка ненадолго блокирует запросы к базе)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  # Окружение «backup» GitHub создаёт сам при первом запуске — без ограничения по веткам.
  # Поэтому до явного включения (переменная BACKUP_ENABLED=1, её ставит админ ПОСЛЕ настройки окружения)
  # задачу с окружением не запускаем вовсе.
  gate:
    name: Включено?
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        # Значение — через env, а не подстановкой ${{ }} прямо в скрипт: так его нельзя исполнить как код.
        env:
          BACKUP_ENABLED: ${{ vars.BACKUP_ENABLED }}
        run: |
          if [ "$BACKUP_ENABLED" = "1" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Бэкап выключен: нет переменной BACKUP_ENABLED=1 (docs/ops/backup-restore.md, «Настройка»)."
            echo "Бэкап D1 **выключен**: переменная репозитория \`BACKUP_ENABLED\` не равна 1." >> "$GITHUB_STEP_SUMMARY"
          fi

  backup:
    name: Бэкап
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: backup
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # Без установочных скриптов пакетов: шаг дальше получает токен с правом записи в D1.
      - name: Зависимости
        run: npm ci --ignore-scripts
        env:
          WRANGLER_SEND_METRICS: "false"

      - name: Выгрузить, проверить, зашифровать
        run: node scripts/backup-run.mjs
        env:
          CF_BACKUP_TOKEN: ${{ secrets.CF_BACKUP_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Включили — значит настроено: пропавший ключ/секрет дальше — красный прогон, а не «не настроено».
          BACKUP_REQUIRED: "1"

      - name: Сохранить зашифрованный бэкап
        if: hashFiles('backup-out/*.age') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: d1-backup-${{ github.run_id }}
          path: backup-out/
          retention-days: 30
          if-no-files-found: error
