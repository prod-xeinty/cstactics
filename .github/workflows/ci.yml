# CI: на каждый PR и пуш в main — типы, линтер, тесты, сборка.
# Локально то же самое: npm run check
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Токен workflow — только чтение. Права расширяем точечно, если понадобится.
permissions:
  contents: read

# Новый пуш в тот же PR отменяет старый прогон.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  check:
    name: Проверки
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Экшены закреплены по SHA коммита, а не по тегу: тег можно перевесить, SHA — нет.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # для проверки миграций относительно базовой ветки

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Зависимости
        run: npm ci

      # Автодеплой применяет миграции до кода — разрушающие только с меткой PR (docs/ops/deploy.md).
      - name: Миграции только добавляющие
        if: github.event_name == 'pull_request'
        run: node scripts/check-migrations.mjs
        env:
          BASE_REF: ${{ github.base_ref }}
          ALLOW_DESTRUCTIVE_MIGRATION: ${{ contains(github.event.pull_request.labels.*.name, 'разрушающая миграция') && '1' || '' }}

      - name: Типы
        run: npm run typecheck

      - name: Линтер
        run: npm run lint

      - name: Тесты
        run: npm test

      - name: Сборка
        run: npm run build:vinext

      # Сквозные тесты в настоящем браузере против собранного воркера (локальная D1, рантайм Workers).
      - name: Браузер для сквозных тестов
        run: npx playwright install --with-deps chromium

      - name: Сквозные тесты (Playwright)
        run: npm run e2e

      - name: Отчёт Playwright при падении
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ github.run_id }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

      # Вся цепочка бэкапа на локальной D1: выгрузка → проверка → шифрование → расшифровка → восстановление.
      - name: Бэкап — самопроверка
        run: npm run backup:selftest
