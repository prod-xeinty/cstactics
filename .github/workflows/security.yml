# Безопасность на каждый PR и пуш в main: утечки секретов и уязвимые зависимости.
# Локально: см. docs/security/devsecops.md
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1" # раз в неделю: новые уязвимости появляются и без наших коммитов

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Секреты (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 архива gitleaks_8.30.1_linux_x64.tar.gz из официального checksums.txt релиза
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # вся история: секрет, удалённый следующим коммитом, всё равно утёк
          persist-credentials: false

      - name: Установить gitleaks (с проверкой контрольной суммы)
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks

      # Только история проверяемого коммита (HEAD), а не всех веток репозитория:
      # у каждой ветки свой PR и свои проверки, чужая ветка не должна валить эту.
      - name: Проверить историю коммитов
        run: ./gitleaks git --config .gitleaks.toml --redact --no-banner --exit-code 1 --log-opts="HEAD" .

  audit:
    name: Зависимости (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # npm audit читает только package-lock.json, ставить зависимости не нужно.
      - name: critical — нигде, high — в продовых; исключения из security/audit-allowlist.json
        run: node scripts/audit.mjs

  zizmor:
    name: Workflow (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ZIZMOR_VERSION: 1.31.1
      # sha256 колеса zizmor-1.31.1-py3-none-manylinux_2_28_x86_64.whl с PyPI
      ZIZMOR_SHA256: 58e878eb2dbd2c6183c105e1ac28c14f7dd1eca44a783f1fe2a69647d012c410
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Ставим строго эту версию и только с совпадающим хешем — подменённый пакет не встанет.
      # В отдельный venv: системный Python раннера может запрещать pip install (PEP 668).
      - name: Установить zizmor
        run: |
          echo "zizmor==${ZIZMOR_VERSION} --hash=sha256:${ZIZMOR_SHA256}" > "$RUNNER_TEMP/zizmor-req.txt"
          python3 -m venv "$RUNNER_TEMP/zizmor"
          "$RUNNER_TEMP/zizmor/bin/pip" install --no-deps --require-hashes -r "$RUNNER_TEMP/zizmor-req.txt"

      # Ищем в наших workflow инъекции через ${{ }}, лишние права, опасные триггеры, незакреплённые экшены.
      # На PR — офлайн (только сами файлы). На main и по расписанию — ещё и онлайн-проверки через API GitHub:
      # SHA экшена из чужого форка (impostor-commit), экшены с известными уязвимостями.
      - name: Проверить .github/workflows
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            "$RUNNER_TEMP/zizmor/bin/zizmor" --offline --format=github .github/workflows
          else
            "$RUNNER_TEMP/zizmor/bin/zizmor" --format=github .github/workflows
          fi
