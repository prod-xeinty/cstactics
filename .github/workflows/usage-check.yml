# Расход бесплатных лимитов Cloudflare: каждые 6 часов. ≥ 70% → issue (GitHub пришлёт письмо).
# Нужны секреты CLOUDFLARE_API_TOKEN (право Account Analytics: Read) и CLOUDFLARE_ACCOUNT_ID.
name: Лимиты Cloudflare

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write # только чтобы открыть/обновить issue о лимитах

concurrency:
  group: usage-check
  cancel-in-progress: false

jobs:
  usage:
    name: Расход лимитов
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Проверить расход
        run: node scripts/usage-check.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USAGE_THRESHOLD: "0.7"
          USAGE_ASSIGNEE: sK8le
