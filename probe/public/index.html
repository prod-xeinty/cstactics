<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Замер доступности</title>
<style>
  :root {
    --bg: #0F1113; --panel: #15181B; --line: #2C3136;
    --text: #EDEBE6; --muted: #A3A9AF; --accent: #F2A23C;
    --ok: #8FD19E; --ok-bg: #13261A; --warn: #F5D9A8; --warn-bg: #2A2112; --err: #F0A08A;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 8px; letter-spacing: .02em; text-transform: uppercase; }
  p { margin: 0 0 16px; color: var(--muted); }
  label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 4px; }
  input { width: 100%; min-height: 44px; padding: 8px 12px; margin-bottom: 16px;
          background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; font: inherit; }
  button { min-height: 44px; padding: 8px 20px; border: 0; border-radius: 6px; cursor: pointer;
           background: var(--accent); color: #1A1306; font: inherit; font-weight: 600; }
  button[disabled] { opacity: .5; cursor: default; }
  button.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  table { width: 100%; border-collapse: collapse; margin: 8px 0 16px; font-size: 14px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  th { color: var(--muted); font-weight: 500; }
  .ok { color: var(--ok); } .bad { color: var(--err); }
  #verdict { padding: 12px 14px; border-radius: 6px; margin-bottom: 16px; display: none; }
  #verdict.ok { background: var(--ok-bg); } #verdict.warn { background: var(--warn-bg); color: var(--warn); }
  textarea { width: 100%; min-height: 120px; padding: 8px 12px; background: var(--panel); color: var(--text);
             border: 1px solid var(--line); border-radius: 6px; font: 13px/1.4 ui-monospace, Menlo, Consolas, monospace; }
</style>
</head>
<body>
<main>
  <h1>Замер доступности</h1>
  <p>Проверяем, нормально ли с вашего интернета скачиваются файлы разного размера. Это займёт около полуминуты. Ничего не устанавливается и не отправляется — результат вы скопируете и пришлёте сами.</p>

  <label for="isp">Ваш провайдер (МТС, Билайн, Ростелеком, МегаФон…)</label>
  <input id="isp" type="text" maxlength="60" autocomplete="off" placeholder="например, Билайн">

  <label for="net">Как подключены</label>
  <input id="net" type="text" maxlength="60" autocomplete="off" placeholder="мобильный интернет или домашний Wi-Fi">

  <div class="row">
    <button id="run" type="button">Запустить замер</button>
    <button id="copy" class="ghost" type="button" disabled>Скопировать результат</button>
  </div>

  <div id="verdict" role="status"></div>

  <table aria-live="polite">
    <thead><tr><th>Файл</th><th>Попытка</th><th>Результат</th><th>Дошло</th><th>Время</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>

  <label for="out">Текст для отправки</label>
  <textarea id="out" readonly></textarea>
</main>
<script src="probe.js"></script>
</body>
</html>
